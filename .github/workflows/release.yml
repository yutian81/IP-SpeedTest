name: Auto Build & Release

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'main.go'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: write  # 需要写入权限来创建 Tag 和 Release

jobs:
  # 步骤 1: 计算新版本号并创建 Git Tag
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.generate_version.outputs.new_version }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and Tag New Version
        id: generate_version
        run: |
          # --- 1. 获取最新版本并计算新版本号 ---
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "Latest tag found: $LATEST_TAG"

          # 提取并增加修订号
          MAJOR=$(echo "$LATEST_TAG" | cut -d. -f1 | tr -d 'v')
          MINOR=$(echo "$LATEST_TAG" | cut -d. -f2)
          PATCH=$(echo "$LATEST_TAG" | cut -d. -f3)

          # 如果找不到有效的 PATCH 号，则从 v1.0.0 开始
          if ! [[ "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "Failed to parse patch number, defaulting to v1.0.0"
            NEW_VERSION="v1.0.0"
          else
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi
          
          echo "New version: $NEW_VERSION"

          # --- 2. 创建并推送 Git Tag ---
          if git tag -l | grep -q "^$NEW_VERSION$"; then
            echo "Tag $NEW_VERSION already exists. Skipping tag creation."
          else
            echo "Creating and pushing tag $NEW_VERSION"
            git tag "$NEW_VERSION"
            git push origin "$NEW_VERSION"
          fi
          
          # --- 3. 设置 Job Output 供后续 Job 使用 ---
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

  # 步骤 2: 构建二进制文件并发布到 Release
  build-and-release:
    needs: prepare-version # 依赖于版本准备 Job
    runs-on: ubuntu-latest
    if: success()
    
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64] # 简化了架构，以避免 386 和 arm 经常出现的依赖问题
        exclude:
          - goarch: arm64
            goos: windows

    steps:
      - uses: actions/checkout@v4
      
      - name: Build Go Binary and Upload to Release
        uses: wangyoucao577/go-release-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          goversion: 1.21
          binary_name: "iptest"
          ldflags: -s -w -X "main.version=${{ needs.prepare-version.outputs.new_version }}"
          create_release: false 
          release_tag: ${{ needs.prepare-version.outputs.new_version }} 
          asset_name: "iptest-${{ matrix.goos }}-${{ matrix.goarch }}"
          compress_assets: true
