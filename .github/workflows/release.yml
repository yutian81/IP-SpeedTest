name: Auto Build & Release

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - main.go

permissions:
  contents: write
  packages: write

env:
  BIN_NAME: iptest

jobs:
  build-go-binary:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64, arm, 386]
        exclude:
          - goarch: arm64
            goos: windows
          - goarch: 386 
            goos: darwin 
          - goarch: arm
            goos: windows
          - goarch: arm
            goos: darwin

    steps:
      - uses: actions/checkout@v4
     
      - name: Generate new version
        id: generate_version
        run: |
          if [ -f version ]; then
            DEFAULT_TAG=$(cat version)
          else
            echo "version 文件不存在，使用 v1.0.0 作为默认值"
            DEFAULT_TAG="v1.0.0"
          fi

          # 获取最新 tag，如果没有 tag 则使用默认值
          if git tag --list | grep -q .; then
            LATEST_TAG=$(git describe --tags --abbrev=0)
          else
            LATEST_TAG="$DEFAULT_TAG"
          fi
          echo "Latest tag: $LATEST_TAG"

          # 提取主版本号、次版本号和修订号
          MAJOR=$(echo "$LATEST_TAG" | cut -d. -f1 | tr -d 'v')
          MINOR=$(echo "$LATEST_TAG" | cut -d. -f2)
          PATCH=$(echo "$LATEST_TAG" | cut -d. -f3)

          # 增加修订号
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "New version: $NEW_VERSION"

          # 设置环境变量供后续 steps 使用
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

          # 更新仓库version文件
          echo "$NEW_VERSION" > version
          git add version
          git commit -m "Update version to $NEW_VERSION" || echo "No changes to commit"
          git push || echo "Push failed, possibly no changes"
      
      - uses: wangyoucao577/go-release-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          goversion: 1.21
          binary_name: ${{ env.BIN_NAME}}
          ldflags: -s -w -X "main.version=${{ env.NEW_VERSION }}" # 将版本号注入到 Go 二进制文件
          md5sum: false
          release_name: ${{ env.BIN_NAME}}
          release_tag: ${{ env.NEW_VERSION }}
          asset_name: "${{ env.BIN_NAME}}-${{ matrix.goos }}-${{ matrix.goarch }}"
          create_release: true
          compress_assets: true  # 启用压缩功能
